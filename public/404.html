<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Taskbz</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 3rem 3.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo { margin-bottom: 2rem; }
    .logo img { height: 32px; }
    .code {
      font-size: 5rem;
      font-weight: 700;
      color: #6366f1;
      line-height: 1;
      margin-bottom: .5rem;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: .75rem; }
    p  { color: #6b7280; font-size: .95rem; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      padding: .7rem 1.6rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: .95rem;
      transition: background .15s;
    }
    .btn:hover { background: #4f46e5; }
    @media (max-width: 500px) { .card { padding: 2rem 1.5rem; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <a href="/">
        <img src="images/logo-light.svg" alt="Taskbz">
      </a>
    </div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have been moved.</p>
    <a class="btn" href="/">Go to Taskbz</a>
  </div>
</body>
</html>
