<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle decorative large bars (background motif) -->
  <rect x="820" y="-40" width="60" height="440" rx="30" fill="#F8FAFC" opacity="0.04"/>
  <rect x="900" y="80" width="60" height="320" rx="30" fill="#F8FAFC" opacity="0.03"/>
  <rect x="980" y="20" width="60" height="380" rx="30" fill="#F8FAFC" opacity="0.035"/>
  <rect x="1060" y="100" width="60" height="240" rx="30" fill="#F8FAFC" opacity="0.025"/>
  <rect x="1140" y="40" width="60" height="340" rx="30" fill="#F8FAFC" opacity="0.02"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="#3B82F6" opacity="0.7"/>

  <!-- Logo mark — scaled up, centered vertically on left -->
  <g transform="translate(96, 195)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="#F8FAFC" opacity="0.05"/>
    <rect x="0" y="0" width="200" height="200" rx="48" fill="none" stroke="#F8FAFC" stroke-width="1.5" stroke-opacity="0.12"/>
    <!-- Three bars -->
    <rect x="36" y="42" width="38" height="116" rx="19" fill="#F8FAFC" opacity="0.92"/>
    <rect x="82" y="42" width="38" height="88"  rx="19" fill="#F8FAFC" opacity="0.72"/>
    <rect x="128" y="42" width="38" height="104" rx="19" fill="#F8FAFC" opacity="0.52"/>
  </g>

  <!-- Divider -->
  <rect x="344" y="195" width="1.5" height="200" fill="#F8FAFC" opacity="0.12"/>

  <!-- Wordmark -->
  <text x="372" y="303" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" letter-spacing="-3" fill="#F8FAFC">Task<tspan fill="#64748B">bz</tspan></text>

  <!-- Tagline -->
  <text x="374" y="362" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94A3B8" letter-spacing="0.2">Collaborative Kanban Boards — free &amp; real-time</text>

  <!-- Bottom tag -->
  <text x="96" y="556" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569" letter-spacing="2">TASKBZ.COM</text>
</svg>
